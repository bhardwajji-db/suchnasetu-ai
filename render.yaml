# ==============================================================================
# SochnaSetu AI — Render Blueprint Deployment Configuration
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: sochnasetu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_PAGES_DEV
        value: "true"
      - key: AUTH_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_PATH
        value: /app/data/suchnasetu.db
      - key: UPLOADS_DIR
        value: /app/data/uploads
    disk:
      name: sochnasetu-data
      mountPath: /app/data
      sizeGB: 1
