# ==============================================================================
# SochnaSetu AI — Render Blueprint Deployment Specification
# Separate Backend (FastAPI Docker Web Service) and Frontend (Static Site)
# 100% Free Tier Compatible | Zero Mandatory Cloud Costs | Air-Gappable OCR
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API Service: FastAPI + Universal Multilingual OCR
  # ----------------------------------------------------------------------------
  - type: web
    name: sochnasetu-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "7860"
      - key: LLM_PROVIDER
        value: ollama
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_PAGES_DEV
        value: "true"
      - key: DATABASE_PATH
        value: /app/data/suchnasetu.db
      - key: UPLOADS_DIR
        value: /app/data/uploads
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend UI Service: React 19 + TypeScript + Vite Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: sochnasetu-frontend
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sochnasetu-api
          property: host
