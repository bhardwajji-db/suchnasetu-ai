[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notice2action"
version = "0.1.0"
description = "Notice-to-Action Accessibility Assistant using Gemma 4 (PS02)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Avinash", email = "developer@example.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "gTTS>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "live: marks tests as requiring live Ollama and Gemma 4",
]
